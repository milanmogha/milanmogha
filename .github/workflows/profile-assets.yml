name: build profile assets

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

# Everything that renders on the profile is generated here and committed to the
# `output` branch, so the profile never depends on a third-party card service.
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#00ff9c&color_dots=#ebedf0,#c9f7e3,#5ce7b4,#00ff9c,#00b36e
            dist/snake-dark.svg?palette=github-dark&color_snake=#00ff9c&color_dots=#161b22,#0e4429,#006d32,#26a641,#00ff9c

      - name: generate stat cards
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: node .github/scripts/cards.mjs
        env:
          LOGIN: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: a PAT with `repo` scope so private repos count toward the
          # language mix. Without it the card is labelled "public repos only".
          GH_STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN }}

      - name: publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
