<svg xmlns="http://www.w3.org/2000/svg" width="300" height="210" viewBox="0 0 300 210" role="img" aria-label="language mix">
<style>
  .f{font-family:ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,Liberation Mono,monospace}
  .t{fill:#00FF9C;font-size:13px;font-weight:700}
  .k{fill:#4E7C6A;font-size:12px}
  .v{fill:#C9F7E3;font-size:12px;font-weight:700}
  .s{fill:#4E7C6A;font-size:10px}
  .row{opacity:0;animation:in .45s ease forwards}
  @keyframes in{to{opacity:1}}
  @media (prefers-reduced-motion:reduce){.row{animation:none;opacity:1}}
</style>
<rect x=".5" y=".5" width="299" height="209" rx="8" fill="#0D1117" stroke="#16241F"/>
<g class="f">
  <circle cx="18" cy="19" r="4" fill="#00FF9C"/>
  <text x="30" y="23" class="t">language mix</text>
  
    <rect x="30" y="46" width="240" height="9" rx="4.5" fill="#1B2E28"/>
