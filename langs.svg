    <g class="row" style="animation-delay:140ms">
      <circle cx="34" cy="119" r="4" fill="#663399"/>
      <text x="46" y="123" class="k">CSS</text>
      <text x="270" y="123" class="v" text-anchor="end">22.1%</text>
    </g>
    <g class="row" style="animation-delay:210ms">
      <circle cx="34" cy="139" r="4" fill="#3178c6"/>
